<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>색상 팔레트 추출기</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 900px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-size: 2.5em;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 1.1em;
    }

    .upload-area {
      border: 3px dashed #667eea;
      border-radius: 15px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: #f8f9ff;
      margin-bottom: 30px;
    }

    .upload-area:hover {
      border-color: #764ba2;
      background: #f0f2ff;
      transform: translateY(-2px);
    }

    .upload-area.dragover {
      border-color: #764ba2;
      background: #e8ebff;
      transform: scale(1.02);
    }

    .upload-icon {
      font-size: 4em;
      margin-bottom: 15px;
    }

    .upload-text {
      font-size: 1.2em;
      color: #667eea;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .upload-subtext {
      color: #999;
      font-size: 0.9em;
    }

    #fileInput {
      display: none;
    }

    .preview-section {
      display: none;
      margin-bottom: 30px;
    }

    .preview-section.active {
      display: block;
    }

    .image-preview {
      text-align: center;
      margin-bottom: 20px;
    }

    #previewImage {
      max-width: 100%;
      max-height: 300px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      font-weight: 600;
      color: #555;
    }

    input[type="range"] {
      width: 150px;
      cursor: pointer;
    }

    .color-count {
      background: #667eea;
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      font-weight: 600;
      min-width: 40px;
      text-align: center;
    }

    .palette-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .color-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }

    .color-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .color-swatch {
      height: 100px;
      position: relative;
    }

    .color-info {
      padding: 15px;
      text-align: center;
    }

    .color-hex {
      font-weight: 700;
      font-size: 1.1em;
      color: #333;
      margin-bottom: 5px;
    }

    .color-rgb {
      font-size: 0.85em;
      color: #666;
    }

    .copy-notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #4CAF50;
      color: white;
      padding: 15px 25px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      display: none;
      animation: slideIn 0.3s ease;
      z-index: 1000;
    }

    .copy-notification.show {
      display: block;
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 25px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
    }

    .btn:active {
      transform: translateY(0);
    }

    .export-section {
      text-align: center;
      padding-top: 20px;
      border-top: 2px solid #f0f0f0;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      h1 {
        font-size: 1.8em;
      }

      .palette-container {
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 15px;
      }

      .controls {
        flex-direction: column;
      }

      input[type="range"] {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 색상 팔레트 추출기</h1>
    <p class="subtitle">이미지를 업로드하면 주요 색상을 자동으로 추출합니다</p>

    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">📸</div>
      <div class="upload-text">이미지를 클릭하거나 드래그하세요</div>
      <div class="upload-subtext">JPG, PNG, GIF 지원</div>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="preview-section" id="previewSection">
      <div class="image-preview">
        <img id="previewImage" alt="미리보기">
      </div>

      <div class="controls">
        <div class="control-group">
          <label for="colorCount">추출할 색상 수:</label>
          <input type="range" id="colorCount" min="3" max="10" value="6" step="1">
          <span class="color-count" id="colorCountValue">6</span>
        </div>
      </div>

      <div class="palette-container" id="paletteContainer"></div>

      <div class="export-section">
        <button class="btn" id="exportBtn">🎨 팔레트 이미지로 저장</button>
      </div>
    </div>
  </div>

  <div class="copy-notification" id="copyNotification">
    ✓ 색상 코드가 복사되었습니다!
  </div>

  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const previewSection = document.getElementById('previewSection');
    const previewImage = document.getElementById('previewImage');
    const colorCountSlider = document.getElementById('colorCount');
    const colorCountValue = document.getElementById('colorCountValue');
    const paletteContainer = document.getElementById('paletteContainer');
    const copyNotification = document.getElementById('copyNotification');
    const exportBtn = document.getElementById('exportBtn');

    let currentColors = [];

    // 업로드 영역 클릭
    uploadArea.addEventListener('click', () => fileInput.click());

    // 드래그 앤 드롭
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        handleImage(file);
      }
    });

    // 파일 선택
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        handleImage(file);
      }
    });

    // 색상 수 슬라이더
    colorCountSlider.addEventListener('input', (e) => {
      colorCountValue.textContent = e.target.value;
      if (previewImage.src) {
        extractColors(previewImage, parseInt(e.target.value));
      }
    });

    // 이미지 처리
    function handleImage(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        previewImage.src = e.target.result;
        previewImage.onload = () => {
          previewSection.classList.add('active');
          extractColors(previewImage, parseInt(colorCountSlider.value));
        };
      };
      reader.readAsDataURL(file);
    }

    // 색상 추출 (K-means 클러스터링 알고리즘)
    function extractColors(img, numColors) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      
      // 성능을 위해 이미지 크기 조정
      const maxSize = 200;
      let width = img.width;
      let height = img.height;
      
      if (width > height) {
        if (width > maxSize) {
          height *= maxSize / width;
          width = maxSize;
        }
      } else {
        if (height > maxSize) {
          width *= maxSize / height;
          height = maxSize;
        }
      }
      
      canvas.width = width;
      canvas.height = height;
      ctx.drawImage(img, 0, 0, width, height);
      
      const imageData = ctx.getImageData(0, 0, width, height);
      const pixels = imageData.data;
      
      // 픽셀 데이터 추출 (샘플링)
      const colors = [];
      for (let i = 0; i < pixels.length; i += 4 * 10) { // 10픽셀마다 샘플링
        const r = pixels[i];
        const g = pixels[i + 1];
        const b = pixels[i + 2];
        const a = pixels[i + 3];
        
        // 투명한 픽셀과 너무 밝거나 어두운 픽셀 제외
        if (a > 125 && (r + g + b) > 30 && (r + g + b) < 720) {
          colors.push([r, g, b]);
        }
      }
      
      // K-means 클러스터링
      const palette = kMeans(colors, numColors);
      currentColors = palette;
      displayPalette(palette);
    }

    // K-means 알고리즘
    function kMeans(colors, k, maxIterations = 10) {
      // 초기 중심점 랜덤 선택
      let centroids = [];
      for (let i = 0; i < k; i++) {
        centroids.push(colors[Math.floor(Math.random() * colors.length)]);
      }
      
      for (let iter = 0; iter < maxIterations; iter++) {
        // 각 색상을 가장 가까운 중심점에 할당
        const clusters = Array.from({ length: k }, () => []);
        
        colors.forEach(color => {
          let minDist = Infinity;
          let clusterIndex = 0;
          
          centroids.forEach((centroid, i) => {
            const dist = colorDistance(color, centroid);
            if (dist < minDist) {
              minDist = dist;
              clusterIndex = i;
            }
          });
          
          clusters[clusterIndex].push(color);
        });
        
        // 새로운 중심점 계산
        centroids = clusters.map(cluster => {
          if (cluster.length === 0) return centroids[0];
          
          const sum = cluster.reduce((acc, color) => {
            return [acc[0] + color[0], acc[1] + color[1], acc[2] + color[2]];
          }, [0, 0, 0]);
          
          return [
            Math.round(sum[0] / cluster.length),
            Math.round(sum[1] / cluster.length),
            Math.round(sum[2] / cluster.length)
          ];
        });
      }
      
      // 색상 빈도순으로 정렬
      return centroids.sort((a, b) => {
        const brightnessA = (a[0] + a[1] + a[2]) / 3;
        const brightnessB = (b[0] + b[1] + b[2]) / 3;
        return brightnessB - brightnessA;
      });
    }

    // 색상 간 거리 계산
    function colorDistance(c1, c2) {
      return Math.sqrt(
        Math.pow(c1[0] - c2[0], 2) +
        Math.pow(c1[1] - c2[1], 2) +
        Math.pow(c1[2] - c2[2], 2)
      );
    }

    // RGB를 HEX로 변환
    function rgbToHex(r, g, b) {
      return '#' + [r, g, b].map(x => {
        const hex = x.toString(16);
        return hex.length === 1 ? '0' + hex : hex;
      }).join('').toUpperCase();
    }

    // 팔레트 표시
    function displayPalette(colors) {
      paletteContainer.innerHTML = '';
      
      colors.forEach(color => {
        const [r, g, b] = color;
        const hex = rgbToHex(r, g, b);
        
        const card = document.createElement('div');
        card.className = 'color-card';
        card.innerHTML = `
          <div class="color-swatch" style="background-color: ${hex}"></div>
          <div class="color-info">
            <div class="color-hex">${hex}</div>
            <div class="color-rgb">RGB(${r}, ${g}, ${b})</div>
          </div>
        `;
        
        card.addEventListener('click', () => copyToClipboard(hex));
        paletteContainer.appendChild(card);
      });
    }

    // 클립보드에 복사
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        copyNotification.classList.add('show');
        setTimeout(() => {
          copyNotification.classList.remove('show');
        }, 2000);
      });
    }

    // 팔레트 이미지로 저장
    exportBtn.addEventListener('click', () => {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      
      const colorWidth = 150;
      const colorHeight = 200;
      const padding = 20;
      const textHeight = 80;
      
      canvas.width = (colorWidth + padding) * currentColors.length + padding;
      canvas.height = colorHeight + textHeight + padding * 2;
      
      // 배경
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // 색상 그리기
      currentColors.forEach((color, i) => {
        const [r, g, b] = color;
        const hex = rgbToHex(r, g, b);
        const x = padding + i * (colorWidth + padding);
        
        // 색상 사각형
        ctx.fillStyle = hex;
        ctx.fillRect(x, padding, colorWidth, colorHeight);
        
        // 테두리
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, padding, colorWidth, colorHeight);
        
        // 텍스트
        ctx.fillStyle = '#333333';
        ctx.font = 'bold 18px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(hex, x + colorWidth / 2, colorHeight + padding + 30);
        
        ctx.font = '14px Arial';
        ctx.fillStyle = '#666666';
        ctx.fillText(`RGB(${r}, ${g}, ${b})`, x + colorWidth / 2, colorHeight + padding + 55);
      });
      
      // 다운로드
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'color-palette.png';
        a.click();
        URL.revokeObjectURL(url);
      });
    });
  </script>
</body>
</html>
